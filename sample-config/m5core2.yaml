esphome:
  name: m5core2
  friendly_name: M5Core2
  min_version: 2025.12.0
esp32:
  board: m5stack-core2
  framework:
    type: arduino

# LVGL + grafika lubi PSRAM
psram:
  mode: quad
  speed: 80MHz

logger:

api:

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "M5Core2 Fallback"
    password: !secret fallback_ap_password

captive_portal:

web_server:
  port: 80

# --- I2C (touch + PMIC) ---
i2c:
  - id: bus_a
    sda: GPIO21
    scl: GPIO22
    scan: true

i2c_device:
  id: axp_raw
  address: 0x34
  i2c_id: bus_a

# --- Zasilanie ekranu (Core2 v1.1 = AXP2101) ---
external_components:
  - source: github://Cyklon79/esphome-axp2101@Release
    components: [ axp2101 ]
    refresh: 0s

sensor:
  - platform: axp2101
    model: M5CORE2
    address: 0x34
    id: axp_comp
    i2c_id: bus_a
    update_interval: 10s
    battery_voltage:
      name: "Battery Voltage"
      id: battery_voltage
      device_class: Voltage
      unit_of_measurement: "V"
      state_class: measurement
    battery_level:
      name: "Battery Level"
      id: battery_level_id
      device_class: battery
      unit_of_measurement: "%"
      state_class: measurement
    battery_charging:
      name: "Battery Charging"
      id: battery_charging

binary_sensor:
  - platform: status
    name: "M5Core2 Status"

output:
  - platform: template
    id: backlight_out
    type: float
    write_action:
      - lambda: |-
          // state: 0.0 .. 1.0
          id(axp_comp).set_brightness(state);

light:
  - platform: monochromatic
    name: "M5Core2 Backlight"
    id: backlight_light
    icon: "mdi:brightness-6"
    output: backlight_out
    gamma_correct: 1.0
    restore_mode: RESTORE_DEFAULT_ON

# --- SPI (ekran) ---
spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23
  miso_pin: GPIO38

font:
  - file: "gfonts://Roboto"
    id: roboto
    size: 24

display:
  - platform: ili9xxx
    model: M5STACK
    dimensions: 320x240
    cs_pin: GPIO5
    dc_pin: GPIO15
    invert_colors: false
    update_interval: 500ms
    lambda: |-
      // --- Read sensors/state from ESPHome entities ---
      float batt_v = NAN;
      float batt_pct = NAN;
      bool charging = false;

      if (!isnan(id(battery_voltage).state)) batt_v = id(battery_voltage).state;        // Volts
      if (!isnan(id(battery_level_id).state)) batt_pct = id(battery_level_id).state;   // Percent
      charging = id(battery_charging).state;

      // Read brightness from the Light entity (0.0 .. 1.0)
      float bri01 = id(backlight_light).current_values.get_brightness();
      float bri_pct = bri01 * 100.0f;

      // --- Clear screen (needs esphome::Color) ---
      it.fill(Color(0, 0, 0));  // black

      // --- Render text ---
      
      it.printf(10, 50, id(roboto), "Brightness: %.0f%%", bri_pct);

      if (!isnan(batt_pct))
        it.printf(10, 90, id(roboto), "Battery: %.0f%%", batt_pct);
      else
        it.printf(10, 90, id(roboto), "Battery: --%%");

      if (!isnan(batt_v))
        it.printf(10, 130, id(roboto), "Voltage: %.2f V", batt_v);
      else
        it.printf(10, 130, id(roboto), "Voltage: --.- V");

      it.printf(10, 170, id(roboto), "Charging: %s", charging ? "YES" : "NO");
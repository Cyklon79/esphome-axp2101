esphome:
  name: m5core2
  friendly_name: M5Core2
  min_version: 2025.12.0
  on_boot:
    - priority: 600
      then:
        - delay: 300ms
        - light.turn_on:
            id: backlight_light
            brightness: !lambda return id(saved_brightness);
    - priority: 800
      then:
        - lambda: |-
            auto cause = esp_sleep_get_wakeup_cause();
            ESP_LOGW("wakeup", "Wakeup cause: %d", (int)cause);

esp32:
  board: m5stack-core2
  framework:
    type: arduino

psram:
  mode: quad
  speed: 80MHz

logger:
  level: DEBUG
  logs:
    sensor: INFO
    text_sensor: INFO

substitutions:
  temp_entity: sensor.th_sypialnia_temperature
  sw1_entity: light.sp_sypialnia_lampka_2
  sw2_entity: light.ws_sypialnia_lozko_l1


api:

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "M5Core2 Fallback"
    password: !secret fallback_ap_password

captive_portal:

# TBD: Disable for production
web_server:
  port: 80

i2c:
  - id: bus_a
    sda: GPIO21
    scl: GPIO22
    # TBD: set to false for production
    scan: true

external_components:
  - source:
      type: local
      path: /config/esphome/my_components/esphome-axp2101/components
    components: [ axp2101 ]
    # TBD: Remove for production
    refresh: 0s

globals:
  - id: battery_is_charging
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: v_filt
    type: float
    restore_value: no
    initial_value: '0.0'
  - id: slope_filt_vph
    type: float
    restore_value: no
    initial_value: '0.0'
  - id: v_prev
    type: float
    restore_value: no
    initial_value: '0.0'
  - id: stable_counter
    type: int
    restore_value: no
    initial_value: '0'
  - id: mode
    type: int          # 0=DETECTING, 1=CHARGING, 2=FULL, 3=DISCHARGING
    restore_value: no
    initial_value: '0'
  - id: last_pwr_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: saved_brightness
    type: float
    restore_value: yes
    initial_value: '0.6'   # domyślna jasność po pierwszym starcie

switch:
  - platform: template
    id: sw1_hass
    optimistic: true
    internal: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - homeassistant.action:
          action: light.turn_on
          data:
            entity_id: ${sw1_entity}
    on_turn_off:
      - homeassistant.action:
          action: light.turn_off
          data:
            entity_id: ${sw1_entity}

  - platform: template
    id: sw2_hass
    optimistic: true
    internal: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - homeassistant.action:
          action: light.turn_on
          data:
            entity_id: ${sw2_entity}
    on_turn_off:
      - homeassistant.action:
          action: light.turn_off
          data:
            entity_id: ${sw2_entity}


deep_sleep:
  id: deep_sleep_ctrl
  wakeup_pin:
    number: GPIO39
    inverted: true

script:
  - id: power_off
    mode: single
    then:
      - lambda: |-
          // zapisz aktualną jasność (0.0 .. 1.0)
          float b = id(backlight_light).current_values.get_brightness();
          if (b > 0.01f) id(saved_brightness) = b;
          ESP_LOGD("pwr", "Saved brightness=%.3f", id(saved_brightness));
          id(axp_comp).set_brightness(0.0f);
      - logger.log: "POWER_OFF requested -> entering deep sleep in 1s"
#      - light.turn_off: backlight_light
      - delay: 1s
      - deep_sleep.enter: deep_sleep_ctrl


text_sensor:
  - platform: template
    name: "Battery Mode"
    id: battery_mode

sensor:
  - platform: axp2101
    model: M5CORE2
    address: 0x34
    id: axp_comp
    i2c_id: bus_a
    update_interval: 10s
    battery_voltage:
      name: "Battery Voltage"
      id: battery_voltage
      device_class: voltage
      unit_of_measurement: "V"
      state_class: measurement
    battery_level:
      name: "Battery Level"
      id: battery_level_id
      device_class: battery
      unit_of_measurement: "%"
      state_class: measurement
      on_value:
        then:
          - lvgl.label.update:
              id: batt_pct
              text:
                format: "%0.0f%%"
                args: [id(battery_level_id).state]
          - lvgl.label.update:
              id: batt_icon
              text: !lambda |-
                // zwraca UTF-8 ikony MDI
                static char buf[8];
                std::string icon;
                float pct = id(battery_level_id).state;

                if (id(battery_is_charging)) icon = "\U000F0084";
                else if (pct >= 99.0) icon = "\U000F0079";
                else if (pct > 90) icon = "\U000F0082";
                else if (pct > 80) icon = "\U000F0081";
                else if (pct > 70) icon = "\U000F0080";
                else if (pct > 60) icon = "\U000F007F";
                else if (pct > 50) icon = "\U000F007E";
                else if (pct > 40) icon = "\U000F007D";
                else if (pct > 30) icon = "\U000F007C";
                else if (pct > 20) icon = "\U000F007B";
                else if (pct > 10) icon = "\U000F007A";
                else if (pct > 0)  icon = "\U000F008E";
                else             icon = "\U000F0091";

                snprintf(buf, sizeof(buf), "%s", icon.c_str());
                return buf;
  - platform: homeassistant
    id: ha_temp
    entity_id: ${temp_entity}
    on_value:
      then:
        # --- górne 3 "wykresy" (arc) ---
        - lvgl.arc.update:
            id: chart_1_arc
            value: !lambda |-
              float t = x;
              if (!isfinite(t)) return 0;
              if (t < 0) t = 0;
              if (t > 30) t = 30;
              return (int) lroundf(t);

        - lvgl.arc.update:
            id: chart_2_arc
            value: !lambda |-
              float t = x;
              if (!isfinite(t)) return 0;
              if (t < 0) t = 0;
              if (t > 30) t = 30;
              return (int) lroundf(t);

        - lvgl.arc.update:
            id: chart_3_arc
            value: !lambda |-
              float t = x;
              if (!isfinite(t)) return 0;
              if (t < 0) t = 0;
              if (t > 30) t = 30;
              return (int) lroundf(t);

        # --- dolny bar ---
        - lvgl.bar.update:
            id: chart_4_bar
            value: !lambda |-
              float t = x;
              if (!isfinite(t)) return 0;
              if (t < 0) t = 0;
              if (t > 30) t = 30;
              return (int) lroundf(t);

        # --- teksty wartości ---
        - lvgl.label.update:
            id: chart_1_val
            text:
              format: "%.1f°C"
              args: [x]
        - lvgl.label.update:
            id: chart_2_val
            text:
              format: "%.1f°C"
              args: [x]
        - lvgl.label.update:
            id: chart_3_val
            text:
              format: "%.1f°C"
              args: [x]
        - lvgl.label.update:
            id: chart_4_val
            text:
              format: "%.1f°C"
              args: [x]


binary_sensor:
  - platform: status
    name: "M5Core2 Status"
    entity_category: diagnostic

  - platform: homeassistant
    id: ha_sw1
    entity_id: ${sw1_entity}
    trigger_on_initial_state: true
    on_state:
      then:
        - lvgl.widget.update:
            id: sw1_lvgl
            state:
              checked: !lambda return x;
        - lvgl.label.update:
            id: sw1_status
            text: !lambda |-
              return std::string(x ? "ON" : "OFF");

  - platform: homeassistant
    id: ha_sw2
    entity_id: ${sw2_entity}
    trigger_on_initial_state: true
    on_state:
      then:
        - lvgl.widget.update:
            id: sw2_lvgl
            state:
              checked: !lambda return x;
        - lvgl.label.update:
            id: sw2_status
            text: !lambda |-
              return std::string(x ? "ON" : "OFF");


output:
  - platform: template
    id: backlight_out
    type: float
    write_action:
      - lambda: |-
          ESP_LOGD("pwr", "Backlight write_action state=%.3f", state);
          // state: 0.0 .. 1.0
          id(axp_comp).set_brightness(state);

light:
  - platform: monochromatic
    name: "M5Core2 Backlight"
    id: backlight_light
    icon: "mdi:brightness-6"
    output: backlight_out
    gamma_correct: 1.0
    restore_mode: RESTORE_DEFAULT_ON
    on_state:
      - component.update: lcd

# --- SPI (ekran) ---
spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23
  miso_pin: GPIO38

font:
  - file: "gfonts://Roboto"
    id: roboto
    size: 16
  - file: "gfonts://Roboto"
    id: roboto_small
    size: 14

  - file: "fonts/materialdesignicons-webfont.ttf"
    id: mdi_20
    size: 20
    bpp: 4
    glyphs:
      - "\U000F0091" # mdi-battery-unknown
      - "\U000F0084" # mdi-battery-charging
      - "\U000F0079" # mdi-battery (full)
      - "\U000F0082" # mdi-battery-90
      - "\U000F0081" # mdi-battery-80
      - "\U000F0080" # mdi-battery-70
      - "\U000F007F" # mdi-battery-60
      - "\U000F007E" # mdi-battery-50
      - "\U000F007D" # mdi-battery-40
      - "\U000F007C" # mdi-battery-30
      - "\U000F007B" # mdi-battery-20
      - "\U000F007A" # mdi-battery-10
      - "\U000F008E" # mdi-battery-outline
      - "\U000F05A9" # mdi-wifi
      - "\U000F05AA" # mdi-wifi-off


display:
  - platform: mipi_spi
    id: lcd
    model: M5CORE2
    auto_clear_enabled: false
    update_interval: never

touchscreen:
  - platform: ft63x6
    id: ts
    i2c_id: bus_a
    address: 0x38
    display: lcd
    update_interval: 50ms
    # interrupt_pin: GPIO39

    on_touch:
      then:
        - lambda: |-
            const uint32_t now = millis();
            if (now - id(last_pwr_ms) < 800) return;

            const int x = touch.x;
            const int y = touch.y;

            // Twoje logi dla B: x≈156, y=239
            // Środek (107..213) i sam dół ekranu (>=232)
            if (x >= 107 && x <= 213 && y >= 232) {
              id(last_pwr_ms) = now;
              ESP_LOGW("pwr", "TouchB detected (x=%d y=%d) -> power_off()", x, y);
              id(power_off).execute();
            }

interval:
  - interval: 5s
    then:
      - if:
          condition:
            wifi.connected
          then:
            - lvgl.label.update:
                id: wifi_icon
                text: "\U000F05A9"     # wifi
          else:
            - lvgl.label.update:
                id: wifi_icon
                text: "\U000F05AA"    # wifi-off  
  - interval: 30s
    then:
      - lambda: |-
          const float dt_s = 30.0f;
          // Jeśli chcesz ograniczyć false-positive, odkomentuj i licz trend tylko przy stabilnym obciążeniu, np. gdy ekran off:
          // if (id(display_backlight).current_values.is_on()) return;

          float v = id(battery_voltage).state;
          if (!isfinite(v) || v < 2.5f || v > 4.5f) return;

          if (id(v_filt) <= 0.01f) {
            id(v_filt) = v;
            id(v_prev) = v;
            id(slope_filt_vph) = 0.0f;
            id(battery_mode).publish_state("DETECTING");
            return;
          }

          // 1) EMA napięcia
          const float a_v = 0.2f;
          id(v_filt) = (a_v * v) + ((1.0f - a_v) * id(v_filt));

          // 2) Trend w V/h 
          float dv = id(v_filt) - id(v_prev);
          id(v_prev) = id(v_filt);
          float slope_vph = dv * (3600.0f / dt_s);

          // 3) EMA trendu
          const float a_s = 0.3f;
          id(slope_filt_vph) = (a_s * slope_vph) + ((1.0f - a_s) * id(slope_filt_vph));

          // Progi
          const float V_FULL = 4.15f;
          const float V_FULL_HI = 0.02f;   // histereza górą
          const float V_CHG_HI  = 0.03f;   // histereza do ładowania (poniżej)
          const float S_POS = 0.010f;      // +10 mV/h
          const float S_NEG = -0.010f;     // -10 mV/h
          const float S_FLAT = 0.100f;

          // Logika stanowa z licznikami
          int new_mode = id(mode);

          bool want_charging = (id(v_filt) < (V_FULL - V_CHG_HI)) && (id(slope_filt_vph) > S_POS);
          bool want_full     = (id(v_filt) > (V_FULL + V_FULL_HI)) && (fabsf(id(slope_filt_vph)) < S_FLAT);
          bool want_dis      = (id(slope_filt_vph) < S_NEG);

          // Priorytet: FULL > CHARGING > DISCHARGING
          int candidate = 0;
          if (want_full) candidate = 2;
          else if (want_charging) candidate = 1;
          else if (want_dis) candidate = 3;
          else candidate = 0;

          if (candidate == id(mode)) {
            id(stable_counter) = 0; // już jesteśmy w tym stanie
          } else {
            id(stable_counter)++;
            // minimalny czas potwierdzenia
            int req = 1;
            if (candidate == 2) req = 2; // FULL
            else if (candidate == 1 || candidate == 3) req = 3; // CHG/DIS: 
            else req = 3; // DETECTING: 

            if (id(stable_counter) >= req) {
              new_mode = candidate;
              id(stable_counter) = 0;
            }
          }

          id(mode) = new_mode;

          // Publikacja trybu + ustawienie Twojej flagi do ikonki
          const char* txt = "DETECTING";
          if (id(mode) == 1) txt = "CHARGING";
          else if (id(mode) == 2) txt = "FULL";
          else if (id(mode) == 3) txt = "DISCHARGING";
          id(battery_mode).publish_state(txt);

          id(battery_is_charging) = (id(mode) == 1);

lvgl:
  displays: [lcd]
  touchscreens:
    - touchscreen_id: ts

  top_layer:
    widgets:
      # --- BATTERY (top-left) ---
      - label:
          id: batt_icon
          text: "\U000F0091"
          align: top_left
          x: 8
          y: 4
          text_font: mdi_20
          text_color: 0x808080
          widgets:
            - label:
                id: batt_pct
                text: "--%"
                text_font: roboto_small
                text_color: 0x808080
                align_to:
                  id: batt_icon
                  align: OUT_RIGHT_MID
                  x: 6

      # --- WIFI (top-right) ---
      - label:
          id: wifi_icon
          text: "\U000F05AA"     # wifi-off na start
          align: top_right
          x: -8
          y: 4
          text_font: mdi_20
          text_color: 0x808080

  pages:
    - id: main_page
      width: 320
      height: 240
      pad_top: 28           # zostawia miejsce na top_layer
      pad_left: 8
      pad_right: 8
      pad_bottom: 8
      bg_color: 0x000000
      scrollbar_mode: "OFF"
      widgets:
        - obj:
            id: grid_root
            width: 100%
            height: 100%
            bg_opa: TRANSP
            border_opa: TRANSP
            pad_all: 0
            scrollable: false
            layout:
              type: GRID
              grid_columns: [FR(1), FR(1), FR(1)]
              grid_rows: [FR(1), FR(1)]
              pad_row: 8
              pad_column: 8
            widgets:

              # ====== TOP ROW: 3 gauges (arc) ======
              - arc:
                  id: chart_1_arc
                  grid_cell_row_pos: 0
                  grid_cell_column_pos: 0
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  arc_width: 14
                  value: 0
                  min_value: 0
                  max_value: 30
                  widgets:
                    - label:
                        text: "CH1"
                        align: CENTER
                        y: -10
                        text_font: roboto
                    - label:
                        id: chart_1_val
                        text: "--"
                        align: CENTER
                        y: 10
                        text_font: roboto

              - arc:
                  id: chart_2_arc
                  grid_cell_row_pos: 0
                  grid_cell_column_pos: 1
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  arc_width: 14
                  value: 0
                  min_value: 0
                  max_value: 30
                  widgets:
                    - label:
                        text: "CH2"
                        align: CENTER
                        y: -10
                        text_font: roboto
                    - label:
                        id: chart_2_val
                        text: "--"
                        align: CENTER
                        y: 10
                        text_font: roboto

              - arc:
                  id: chart_3_arc
                  grid_cell_row_pos: 0
                  grid_cell_column_pos: 2
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  arc_width: 14
                  value: 0
                  min_value: 0
                  max_value: 30
                  widgets:
                    - label:
                        text: "CH3"
                        align: CENTER
                        y: -10
                        text_font: roboto
                    - label:
                        id: chart_3_val
                        text: "--"
                        align: CENTER
                        y: 10
                        text_font: roboto

              # ====== BOTTOM ROW: 1 chart + 2 switches ======

              # (A) wykres jako bar (np. 0-100)
              # ====== BOTTOM LEFT: CH4 (labels left, vertical bar right) ======
              - obj:
                  id: ch4_box
                  grid_cell_row_pos: 1
                  grid_cell_column_pos: 0
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  bg_opa: TRANSP
                  border_opa: TRANSP
                  pad_all: 6
                  scrollable: false
                  layout:
                    type: FLEX
                    flex_flow: ROW
                    flex_align_main: SPACE_BETWEEN
                    flex_align_cross: CENTER
                    flex_align_track: CENTER
                  widgets:
                    # LEFT: vertical bar
                    - bar:
                        id: chart_4_bar
                        width: 18
                        height: 100%
                        min_value: 0
                        max_value: 30
                        value: 0

                    # RIGHT: title + value stacked
                    - obj:
                        id: ch4_text
                        width: 60
                        height: 100%
                        bg_opa: TRANSP
                        border_opa: TRANSP
                        pad_all: 0
                        scrollable: false
                        layout:
                          type: FLEX
                          flex_flow: COLUMN
                          flex_align_main: CENTER
                          flex_align_cross: START
                          flex_align_track: CENTER
                        widgets:
                          - label:
                              text: "CH4"
                              text_font: roboto
                          - label:
                              id: chart_4_val
                              text: "--.-°C"
                              text_font: roboto_small



              # (B) switch 1
              - obj:
                  grid_cell_row_pos: 1
                  grid_cell_column_pos: 1
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  bg_opa: TRANSP
                  border_opa: TRANSP
                  scrollable: false
                  widgets:
                    - label:
                        text: "SW1"
                        align: TOP_MID
                        y: 0
                        text_font: roboto
                    - switch:
                        id: sw1_lvgl
                        width: 46
                        height: 24
                        align: CENTER
                        on_click:
                          switch.toggle: sw1_hass

                    - label:
                        id: sw1_status
                        text: "--"
                        width: 100%
                        text_align: CENTER
                        align_to:
                          id: sw1_lvgl
                          align: OUT_BOTTOM_MID
                          y: 6
                        text_font: roboto_small

              # (C) switch 2
              - obj:
                  grid_cell_row_pos: 1
                  grid_cell_column_pos: 2
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  bg_opa: TRANSP
                  border_opa: TRANSP
                  scrollable: false
                  widgets:
                    - label:
                        text: "SW2"
                        align: TOP_MID
                        y: 0
                        text_font: roboto
                    - switch:
                        id: sw2_lvgl
                        width: 46
                        height: 24
                        align: CENTER
                        on_click:
                          switch.toggle: sw2_hass

                    - label:
                        id: sw2_status
                        text: "--"
                        width: 100%
                        text_align: CENTER
                        align_to:
                          id: sw2_lvgl
                          align: OUT_BOTTOM_MID
                          y: 6
                        text_font: roboto_small

